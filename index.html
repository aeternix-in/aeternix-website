document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 href=\"#what\" style=\"font-size:16px;padding:12px 0 8px\">What we do<\/a>\n<a class=\"nav\" href=\"#start\" style=\"font-size:16px;padding:12px 0 8px\">Start<\/a>\n<a class=\"nav\" href=\"#faq\" style=\"font-size:16px;padding:12px 0 8px\">FAQ<\/a>\n<a class=\"nav\" href=\"#contact\" style=\"font-size:16px;padding:12px 0 8px\">Contact<\/a>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"top\" style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,10vw,128px) clamp(20px,4vw,40px) clamp(64px,9vw,112px)\">\n<div style=\"width:56px;height:4px;background:#9CC6E6\"><\/div>\n<h1 style=\"margin:32px 0 0;max-width:900px;font-size:clamp(32px,5vw,60px);font-weight:400;line-height:1.12;letter-spacing:-0.012em\"><span style=\"color:#2E2E2E\">Integrators connect your hospital to NHCX.<\/span> We get the claim approved the first time.<\/h1>\n<p style=\"margin:28px 0 0;max-width:660px;font-size:clamp(19px,1.7vw,22px);line-height:1.55;color:#2E2E2E\">Other vendors sell the connection. We take responsibility for the quality of the claim that goes through it.<\/p>\n<div style=\"margin-top:40px\">\n<a class=\"btn\" href=\"#contact\" style=\"display:inline-block;background:#0A0A0A;color:#FFFFFF;padding:16px 30px;font-size:17px;letter-spacing:0.03em;text-decoration:none\">Request a readiness check<\/a>\n<\/div>\n<\/div>\n\n<div id=\"problem\" style=\"background:#EAF3FA\">\n<div style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,8vw,104px) clamp(20px,4vw,40px)\">\n<h2 style=\"margin:0;font-size:15px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;line-height:1.8\">The problem<\/h2>\n<p style=\"margin:20px 0 0;max-width:760px;font-size:clamp(24px,2.8vw,34px);line-height:1.3\">The insurance desk today.<\/p>\n<div style=\"margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit, minmax(min(400px, 100%), 1fr));gap:0 56px\">\n<div style=\"display:flex;flex-direction:row;gap:20px;padding:22px 0;border-top:1px solid #0A0A0A\">\n<div style=\"flex:0 0 28px;font-size:17px;font-style:italic\">1<\/div>\n<div style=\"font-size:20px;line-height:1.45\">A separate portal for every insurer and TPA, each with its own login and its own form.<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row;gap:20px;padding:22px 0;border-top:1px solid #0A0A0A\">\n<div style=\"flex:0 0 28px;font-size:17px;font-style:italic\">2<\/div>\n<div style=\"font-size:20px;line-height:1.45\">Documents scanned, uploaded, and scanned again when a query asks for them.<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row;gap:20px;padding:22px 0;border-top:1px solid #0A0A0A\">\n<div style=\"flex:0 0 28px;font-size:17px;font-style:italic\">3<\/div>\n<div style=\"font-size:20px;line-height:1.45\">The same queries returning on claim after claim.<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row;gap:20px;padding:22px 0;border-top:1px solid #0A0A0A\">\n<div style=\"flex:0 0 28px;font-size:17px;font-style:italic\">4<\/div>\n<div style=\"font-size:20px;line-height:1.45\">Portals, NHCX and PM-JAY running side by side, with no single view of a claim.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"what\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,8vw,104px) clamp(20px,4vw,40px)\">\n<h2 style=\"margin:0;font-size:15px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;line-height:1.8\">What we do<\/h2>\n<p style=\"margin:20px 0 0;max-width:760px;font-size:clamp(24px,2.8vw,34px);line-height:1.3\">A connection sends the claim. It does not make the claim good.<\/p>\n\n<div style=\"margin-top:36px\">\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:14px 32px;align-items:center;justify-content:space-between\">\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<div style=\"font-size:12px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase\">The same twelve claims, two routes<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 24px;font-size:14px;color:#2E2E2E\">\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:8px\"><span style=\"display:inline-block;width:12px;height:12px;box-sizing:border-box;border-radius:50%;background:#0A0A0A;border:2px solid #0A0A0A\"><\/span><span>A claim<\/span><\/div>\n<div style=\"display:flex;flex-direction:row;align-items:center;gap:8px\"><span style=\"display:inline-block;width:12px;height:12px;box-sizing:border-box;border-radius:50%;background:#9CC6E6;border:2px solid #0A0A0A\"><\/span><span>A claim with a gap in its documents<\/span><\/div>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px\">\n<button class=\"stage\" type=\"button\" sc-camel-on-click=\"{{ toggleRun }}\" style=\"font-family:inherit;font-size:16px;min-height:48px;min-width:96px;padding:10px 18px;background:#FFFFFF;color:#0A0A0A;border:1px solid #9CC6E6;border-radius:0;cursor:pointer\">{{playLabel}}<\/button>\n<button class=\"stage\" type=\"button\" sc-camel-on-click=\"{{ restart }}\" style=\"font-family:inherit;font-size:16px;min-height:48px;padding:10px 18px;background:#FFFFFF;color:#0A0A0A;border:1px solid #9CC6E6;border-radius:0;cursor:pointer\">Restart<\/button>\n<\/div>\n<\/div>\n\n<div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit, minmax(min(420px, 100%), 1fr));gap:16px\">\n\n<div style=\"border:1px dashed #9CC6E6;padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between\">\n<h3 style=\"margin:0;font-size:22px;font-weight:400;line-height:1.25\">Without Aeternix<\/h3>\n<div style=\"font-size:15px;font-style:italic;color:#2E2E2E\">{{wo.status}}<\/div>\n<\/div>\n<div style=\"position:relative;height:152px;margin:0 26px\">\n<div class=\"lbA\" style=\"left:0%\">Desk<\/div>\n<div class=\"lbB\" style=\"left:25%;font-style:italic;color:#5A5A5A\">No check<\/div>\n<di \">\n<div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #CFE4F5;padding-top:10px\"><div style=\"font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums\">{{wo.a}}<\/div><div style=\"font-size:13px;line-height:1.35;color:#2E2E2E\">Approved<\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #CFE4F5;padding-top:10px\"><div style=\"font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums\">{{wo.q}}<\/div><div style=\"font-size:13px;line-height:1.35;color:#2E2E2E\">Insurer queries<\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #CFE4F5;padding-top:10px\"><div style=\"font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums\">{{wo.r}}<\/div><div style=\"font-size:13px;line-height:1.35;color:#2E2E2E\">Sent a second time<\/div><\/div>\n<\/div>\n<\/div>\n\n<div style=\"border:1px solid #0A0A0A;padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between\">\n<h3 style=\"margin:0;font-size:22px;font-weight:400;line-height:1.25\">With Aeternix<\/h3>\n<div style=\"font-size:15px;font-style:italic;color:#2E2E2E\">{{wi.status}}<\/div>\n<\/div>\n<div style=\"position:relative;height:152px;margin:0 26px\">\n<div class=\"lbA\" style=\"left:0%\">Desk<\/div>\n<div class=\"lbB\" style=\"left:25%;font-weight:700\">Our check<\/div>\n<div class=\"lbA\" style=\"left:50%\">Channel<\/div>\n<div class=\"lbB\" style=\"left:75%\">Insurer<\/div>\n<div class=\"lbA\" style=\"left:100%\">Approved<\/div>\n<div style=\"position:absolute;left:0;right:0;top:55px;height:2px;background:#CFE4F5\"><\/div>\n<div style=\"position:absolute;left:25%;top:56px;width:2px;height:32px;margin-left:-1px;background:#CFE4F5\"><\/div>\n<div style=\"position:absolute;left:0%;top:51px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;border-radius:50%;background:#FFFFFF;border:2px solid #9CC6E6\"><\/div>\n<div style=\"position:absolute;left:25%;top:48px;width:16px;height:16px;margin-left:-8px;box-sizing:border-box;background:#EAF3FA;border:2px solid #0A0A0A\"><\/div>\n<div style=\"position:absolute;left:25%;top:83px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;border-radius:50%;background:#FFFFFF;border:2px solid #9CC6E6\"><\/div>\n<div style=\"position:absolute;left:50%;top:51px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;border-radius:50%;background:#FFFFFF;border:2px solid #9CC6E6\"><\/div>\n<div style=\"position:absolute;left:75%;top:51px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;border-radius:50%;background:#FFFFFF;border:2px solid #9CC6E6\"><\/div>\n<div style=\"position:absolute;left:100%;top:51px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;border-radius:50%;background:#FFFFFF;border:2px solid #9CC6E6\"><\/div>\n<div style=\"position:absolute;left:0;right:0;top:116px;font-size:13px;line-height:16px;font-style:italic;color:#2E2E2E\">A gap is fixed at our check, inside the hospital, before the claim is sent.<\/div>\n<sc-for list=\"{{ wi.tokens }}\" as=\"t\" hint-placeholder-count=\"0\">\n<div class=\"tok\" style=\"left: {{t.left}};top: {{t.top}};opacity: {{t.op}};background-color: {{t.bg}}\"><\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px\">\n<div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #CFE4F5;padding-top:10px\"><div style=\"font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums\">{{wi.a}}<\/div><div style=\"font-size:13px;line-height:1.35;color:#2E2E2E\">Approved<\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #CFE4F5;padding-top:10px\"><div style=\"font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums\">{{wi.q}}<\/div><div style=\"font-size:13px;line-height:1.35;color:#2E2E2E\">Insurer queries<\/div><\/div>\n<div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #CFE4F5;padding-top:10px\"><div style=\"font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums\">{{wi.f}}<\/div><div style=\"font-size:13px;line-height:1.35;color:#2E2E2E\">Fixed before sending<\/div><\/div>\n<\/div>\n<\/div>\n\n<\/div>\n<div style=\"margin-top:14px;font-size:14px;font-style:italic;color:#2E2E2E\">An illustration of the method, not a measured result.<\/div>\n<\/div>\n\n<div style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit, minmax(min(400px, 100%), 1fr));gap:40px 56px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:2px solid #0A0A0A;padding-top:22px\">\n<h3 style=\"margin:0;font-size:26px;font-weight:400;line-height:1.22\">Claim quality before submission.<\/h3>\n<p style=\"margin:0;font-size:18px;color:#2E2E2E\">Every claim is checked against what an insurer's medical reviewer will question, by a team that includes clinicians, before it is sent.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:2px solid #0A0A0A;padding-top:22px\">\n<h3 style=\"margin:0;font-size:26px;font-weight:400;line-height:1.22\">No software replacement.<\/h3>\n<p style=\"margin:0;font-size:18px;color:#2E2E2E\">We work on top of your existing system and documents. The hospital does not change its HMIS.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:2px solid #0A0A0A;padding-top:22px\">\n<h3 style=\"margin:0;font-size:26px;font-weight:400;line-height:1.22\">One desk for every channel.<\/h3>\n<p style=\"margin:0;font-size:18px;color:#2E2E2E\">Insurer and TPA portals, NHCX and PM-JAY claims are handled in one workflow during the transition.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:2px solid #0A0A0A;padding-top:22px\">\n<h3 style=\"margin:0;font-size:26px;font-weight:400;line-height:1.22\">On site.<\/h3>\n<p style=\"margin:0;font-size:18px;color:#2E2E2E\">We study the workflow in person and train the insurance desk ourselves.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"start\" style=\"background:#EAF3FA\">\n<div style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,8vw,104px) clamp(20px,4vw,40px)\">\n<h2 style=\"margin:0;font-size:15px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;line-height:1.8\">How we start<\/h2>\n<div style=\"margin-top:32px;display:flex;flex-direction:column\">\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 40px;padding:26px 0;border-top:1px solid #0A0A0A\">\n<h3 style=\"flex:1 1 260px;margin:0;font-size:26px;font-weight:400;line-height:1.22\"><span style=\"font-style:italic;font-size:17px;margin-right:16px\">1<\/span>A study, at no fee<\/h3>\n<p style=\"flex:2 1 400px;min-width:0;margin:0;font-size:18px;color:#2E2E2E\">We study your cashless workflow and check your NHCX readiness, under a mutual NDA. No patient-identifiable data leaves the premises.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 40px;padding:26px 0;border-top:1px solid #0A0A0A\">\n<h3 style=\"flex:1 1 260px;margin:0;font-size:26px;font-weight:400;line-height:1.22\"><span style=\"font-style:italic;font-size:17px;margin-right:16px\">2<\/span>A written report<\/h3>\n<p style=\"flex:2 1 400px;min-width:0;margin:0;font-size:18px;color:#2E2E2E\">You receive a readiness report in writing. It is yours to keep, whatever you decide next.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 40px;padding:26px 0;border-top:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A\">\n<h3 style=\"flex:1 1 260px;margin:0;font-size:26px;font-weight:400;line-height:1.22\"><span style=\"font-style:italic;font-size:17px;margin-right:16px\">3<\/span>A pilot, if agreed<\/h3>\n<p style=\"flex:2 1 400px;min-width:0;margin:0;font-size:18px;color:#2E2E2E\">A pilot follows only under a separate proposal, and only if both sides agree.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"measure\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,8vw,104px) clamp(20px,4vw,40px)\">\n<h2 style=\"margin:0;font-size:15px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;line-height:1.8\">What we measure<\/h2>\n<p style=\"margin:20px 0 0;max-width:720px;color:#2E2E2E\">We track four measures from your own claims and report them to your management. We publish no figure we have not measured.<\/p>\n<div style=\"margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit, minmax(min(210px, 100%), 1fr));gap:32px 32px\">\n<div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #0A0A0A;padding-top:18px\">\n<h3 style=\"margin:0;font-size:22px;font-weight:400;line-height:1.25\">First-pass approval rate<\/h3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#2E2E2E\">Claims approved without a query, as a share of claims sent.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #0A0A0A;padding-top:18px\">\n<h3 style=\"margin:0;font-size:22px;font-weight:400;line-height:1.25\">Pre-auth turnaround<\/h3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#2E2E2E\">Time from the request to the insurer's decision.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #0A0A0A;padding-top:18px\">\n<h3 style=\"margin:0;font-size:22px;font-weight:400;line-height:1.25\">Queries per claim<\/h3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#2E2E2E\">How often the insurer comes back, and for what.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px;border-top:2px solid #0A0A0A;padding-top:18px\">\n<h3 style=\"margin:0;font-size:22px;font-weight:400;line-height:1.25\">Staff hours per claim<\/h3>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#2E2E2E\">Desk time spent on a claim, from admission to settlement.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"team\" style=\"background:#EAF3FA\">\n<div style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,8vw,104px) clamp(20px,4vw,40px)\">\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:24px 64px;margin-bottom:40px\">\n<h2 style=\"flex:1 1 220px;margin:0;font-size:15px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;line-height:1.8\">Team<\/h2>\n<p style=\"flex:3 1 480px;min-width:0;margin:0;font-size:clamp(21px,2.3vw,27px);line-height:1.4\">A team of clinicians and engineers building better healthcare infrastructure.<\/p>\n<\/div>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,175px),1fr));gap:28px 20px\">\n<div style=\"min-width:0\"><img src=\"./images/shashank.jpeg\" alt=\"Shashank Mishra\" style=\"display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#DCE6EC\"><h3 style=\"margin:16px 0 6px;font-size:20px;font-weight:600;line-height:1.3\">Shashank Mishra<\/h3><p style=\"margin:0;font-size:15px;line-height:1.5;color:#2E2E2E\">Founder and CEO<\/p><\/div>\n<div style=\"min-width:0\"><img src=\"./images/hardik.jpeg\" alt=\"Hardik Khariwal\" style=\"display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#DCE6EC\"><h3 style=\"margin:16px 0 6px;font-size:20px;font-weight:600;line-height:1.3\">Hardik Khariwal<\/h3><p style=\"margin:0;font-size:15px;line-height:1.5;color:#2E2E2E\">Co-founder, B.Tech IIT Bombay<\/p><\/div>\n<div style=\"min-width:0\"><img src=\"./images/pragata.jpeg\" alt=\"Pragata Ghosh\" style=\"display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#DCE6EC\"><h3 style=\"margin:16px 0 6px;font-size:20px;font-weight:600;line-height:1.3\">Pragata Ghosh<\/h3><p style=\"margin:0;font-size:15px;line-height:1.5;color:#2E2E2E\">Co-founder, MBBS AIIMS Delhi<\/p><\/div>\n<div style=\"min-width:0\"><img src=\"./images/soumodeep.jpeg\" alt=\"Soumodeep\" style=\"display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#DCE6EC\"><h3 style=\"margin:16px 0 6px;font-size:20px;font-weight:600;line-height:1.3\">Soumodeep<\/h3><p style=\"margin:0;font-size:15px;line-height:1.5;color:#2E2E2E\">Systems Lead (Tech), B.Tech IIT Delhi<\/p><\/div>\n<div style=\"min-width:0\"><img src=\"./images/amith.jpeg\" alt=\"Dr Amith Paruchuri\" style=\"display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#DCE6EC\"><h3 style=\"margin:16px 0 6px;font-size:20px;font-weight:600;line-height:1.3\">Dr Amith Paruchuri<\/h3><p style=\"margin:0;font-size:15px;line-height:1.5;color:#2E2E2E\">Systems Lead (Clinical), AIIMS Delhi<\/p><\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"faq\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,8vw,104px) clamp(20px,4vw,40px)\">\n<h2 style=\"margin:0;font-size:15px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;line-height:1.8\">Questions<\/h2>\n<div style=\"margin-top:32px;display:flex;flex-direction:column\">\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 40px;padding:26px 0;border-top:1px solid #0A0A0A\">\n<h3 style=\"flex:1 1 300px;margin:0;font-size:22px;font-weight:400;line-height:1.3\">Is NHCX mandatory?<\/h3>\n<p style=\"flex:1.6 1 400px;min-width:0;margin:0;font-size:18px;color:#2E2E2E\">There is no blanket legal mandate on hospitals today. IRDAI has directed insurers and providers to onboard, and most major insurers are already connected.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 40px;padding:26px 0;border-top:1px solid #0A0A0A\">\n<h3 style=\"flex:1 1 300px;margin:0;font-size:22px;font-weight:400;line-height:1.3\">Do we need to change our hospital software?<\/h3>\n<p style=\"flex:1.6 1 400px;min-width:0;margin:0;font-size:18px;color:#2E2E2E\">No. We work on top of the system and documents you already have.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 40px;padding:26px 0;border-top:1px solid #0A0A0A\">\n<h3 style=\"flex:1 1 300px;margin:0;font-size:22px;font-weight:400;line-height:1.3\">Does patient data leave the hospital during the study?<\/h3>\n<p style=\"flex:1.6 1 400px;min-width:0;margin:0;font-size:18px;color:#2E2E2E\">No. No patient-identifiable data leaves the premises, and the study runs under a mutual NDA.<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 40px;padding:26px 0;border-top:1px solid #0A0A0A;border-bottom:1px solid #0A0A0A\">\n<h3 style=\"flex:1 1 300px;margin:0;font-size:22px;font-weight:400;line-height:1.3\">What does the study cost?<\/h3>\n<p style=\"flex:1.6 1 400px;min-width:0;margin:0;font-size:18px;color:#2E2E2E\">Nothing.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div id=\"contact\" style=\"background:#0A0A0A;color:#FFFFFF\">\n<div style=\"max-width:1040px;margin:0 auto;padding:clamp(64px,8vw,104px) clamp(20px,4vw,40px) 40px\">\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:48px 80px\">\n<div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;align-items:flex-start\">\n<div style=\"width:56px;height:4px;background:#9CC6E6\"><\/div>\n<h2 style=\"margin:28px 0 0;font-size:clamp(30px,4.2vw,48px);font-weight:400;line-height:1.12\">Request a readiness check.<\/h2>\n<p style=\"margin:18px 0 0;max-width:420px;font-size:18px;color:#D6D6D6\">Tell us who you are. We will write back to arrange a first conversation.<\/p>\n<a class=\"ul\" href=\"mailto:contact@aeternix.in\" style=\"margin-top:24px;display:inline-block;color:#CFE4F5;text-decoration:none;font-size:clamp(20px,2.4vw,26px);border-bottom:1px solid #9CC6E6;padding:10px 0 4px\">contact@aeternix.in<\/a>\n<\/div>\n<div style=\"flex:1.2 1 360px;min-width:0;display:flex;flex-direction:column;gap:22px\">\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<label for=\"f-name\" style=\"font-size:14px;letter-spacing:0.08em;color:#CFE4F5\">Name<\/label>\n<input class=\"fld\" id=\"f-name\" type=\"text\" autocomplete=\"name\" sc-camel-on-change=\"{{ setName }}\" style=\"font-family:inherit;font-size:18px;min-height:48px;width:100%;box-sizing:border-box;padding:8px 0;background:transparent;color:#FFFFFF;border:0;border-bottom:1px solid #9CC6E6;border-radius:0\">\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<label for=\"f-hospital\" style=\"font-size:14px;letter-spacing:0.08em;color:#CFE4F5\">Hospital<\/label>\n<input class=\"fld\" id=\"f-hospital\" type=\"text\" autocomplete=\"organization\" sc-camel-on-change=\"{{ setHospital }}\" style=\"font-family:inherit;font-size:18px;min-height:48px;width:100%;box-sizing:border-box;padding:8px 0;background:transparent;color:#FFFFFF;border:0;border-bottom:1px solid #9CC6E6;border-radius:0\">\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<label for=\"f-role\" style=\"font-size:14px;letter-spacing:0.08em;color:#CFE4F5\">Role<\/label>\n<input class=\"fld\" id=\"f-role\" type=\"text\" autocomplete=\"organization-title\" sc-camel-on-change=\"{{ setRole }}\" style=\"font-family:inherit;font-size:18px;min-height:48px;width:100%;box-sizing:border-box;padding:8px 0;background:transparent;color:#FFFFFF;border:0;border-bottom:1px solid #9CC6E6;border-radius:0\">\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:4px\">\n<label for=\"f-phone\" style=\"font-size:14px;letter-spacing:0.08em;color:#CFE4F5\">Phone<\/label>\n<input class=\"fld\" id=\"f-phone\" type=\"tel\" autocomplete=\"tel\" sc-camel-on-change=\"{{ setPhone }}\" style=\"font-family:inherit;font-size:18px;min-height:48px;width:100%;box-sizing:border-box;padding:8px 0;background:transparent;color:#FFFFFF;border:0;border-bottom:1px solid #9CC6E6;border-radius:0\">\n<\/div>\n<div>\n<a class=\"btn\" href=\"{{ mailto }}\" style=\"display:inline-block;background:#CFE4F5;color:#0A0A0A;padding:16px 30px;font-size:17px;letter-spacing:0.03em;text-decoration:none\">Send request<\/a>\n<\/div>\n<\/div>\n<\/div>\n\n<div style=\"margin-top:clamp(56px,7vw,88px);padding-top:24px;border-top:1px solid #2A2A2A;display:flex;flex-direction:row;flex-wrap:wrap;gap:16px 40px;align-items:baseline;justify-content:space-between\">\n<div style=\"font-size:20px;font-style:italic;color:#FFFFFF\">Make It Exist<\/div>\n<div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 32px;font-size:14px;color:#BDBDBD\">\n<div>© 2026 Aeternix Imperia Private Limited<\/div>\n<a class=\"ul\" href=\"mailto:contact@aeternix.in\" style=\"color:#BDBDBD;text-decoration:none;border-bottom:1px solid #5A5A5A\">contact@aeternix.in<\/a>\n<\/div>\n<\/div>\n<div style=\"margin-top:14px;font-size:13px;line-height:1.5;color:#BDBDBD\">Institutional names indicate team members' affiliations and do not imply endorsement by those institutions or by any government body.<\/div>\n<\/div>\n<\/div>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5000}}\">\nclass Component extends DCLogic {\ncomponentDidMount() {\nvar self = this;\nvar reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nif (reduce) { this.setState({ T: 40, paused: true }); }\nthis._timer = setInterval(function () {\nvar st = self.state || {};\nif (st.paused || document.hidden) { return; }\nvar T = (st.T || 0) + 1;\nif (T > 46) { T = 0; }\nself.setState({ T: T });\n}, 720);\n}\ncomponentWillUnmount() {\nif (this._timer) { clearInterval(this._timer); }\n}\nrenderVals() {\nvar self = this;\nvar st = this.state || {};\nvar T = st.T || 0;\nvar N = 12;\nvar K = '#0A0A0A';\nvar Q = '#9CC6E6';\nvar Y = { t: '49px', b: '97px', d: '81px' };\nvar WO_CLEAN = [[0, 't', K], [25, 't', K], [50, 't', K], [75, 't', K], [75, 't', K], [100, 't', K], [100, 't', K, 0]];\nvar WO_QUERY = [[0, 't', K], [25, 't', K], [50, 't', K], [75, 't', K], [75, 't', Q], [75, 'b', Q], [50, 'b', Q], [25, 'b', Q], [0, 'b', Q], [0, 'b', Q], [0, 't', K], [25, 't', K], [50, 't', K], [75, 't', K], [75, 't', K], [100, 't', K], [100, 't', K, 0]];\nvar WI_CLEAN = [[0, 't', K], [25, 't', K], [25, 't', K], [50, 't', K], [75, 't', K], [75, 't', K], [100, 't', K], [100, 't', K, 0]];\nvar WI_FIX = [[0, 't', K], [25, 't', Q], [25, 'd', Q], [25, 'd', Q], [25, 't', K], [50, 't', K], [75, 't', K], [75, 't', K], [100, 't', K], [100, 't', K, 0]];\nvar flagged = function (k) { return k % 3 === 1; };\nvar build = function (clean, flag) {\nvar slots = [];\nfor (var k = 0; k < N; k++) {\nvar s = T - 2 * k;\nvar script = flagged(k) ? flag : clean;\nif (s >= 0 && s < script.length) {\nvar w = script[s];\nslots.push({ left: w[0] + '%', top: Y[w[1]], bg: w[2], op: w[3] === 0 ? '0' : '1' });\n} else {\nslots.push({ left: '0%', top: Y.t, bg: K, op: '0' });\n}\n}\nreturn slots;\n};\nvar count = function (cleanAt, flagAt, onlyFlagged) {\nvar n = 0;\nfor (var k = 0; k < N; k++) {\nvar s = T - 2 * k;\nvar f = flagged(k);\nif (onlyFlagged && !f) { continue; }\nif (s >= (f ? flagAt : cleanAt)) { n++; }\n}\nreturn n;\n};\nvar woA = count(5, 15, false);\nvar wiA = count(6, 8, false);\nvar setField = function (k) { return function (e) { var o = {}; o[k] = e.target.value; self.setState(o); }; };\nvar body = 'Name: ' + (st.name || '') + '\\nHospital: ' + (st.hospital || '') + '\\nRole: ' + (st.role || '') + '\\nPhone: ' + (st.phone || '');\nreturn {\nwo: { tokens: build(WO_CLEAN, WO_QUERY), a: String(woA), q: String(count(0, 4, true)), r: String(count(0, 11, true)), status: woA === N ? 'All twelve closed' : 'Working' },\nwi: { tokens: build(WI_CLEAN, WI_FIX), a: String(wiA), q: '0', f: String(count(0, 4, true)), status: wiA === N ? 'All twelve closed' : 'Working' },\nplayLabel: st.paused ? 'Play' : 'Pause',\ntoggleRun: function () { self.setState({ paused: !st.paused }); },\nrestart: function () { self.setState({ T: 0, paused: false }); },\nsetName: setField('name'),\nsetHospital: setField('hospital'),\nsetRole: setField('role'),\nsetPhone: setField('phone'),\nmailto: 'mailto:contact@aeternix.in?subject=' + encodeURIComponent('Readiness check request') + '&body=' + encodeURIComponent(body)\n};\n}\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
